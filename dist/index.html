<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#171c21"><title>灰盒车场 · GRAYBOX DRIVE</title><link rel="stylesheet" href="style.css?v=9"></head><body>
<header><div class="brand"><span class="mark">G<span>↗</span></span><div>灰盒车场<small>GRAYBOX DRIVE / 001</small></div></div><div class="stats"><div><small id="race-label">圈数 LAP</small><b id="lap">1 <em>/ 3</em></b></div><div><small>用时 TIME</small><b id="time">00:00.00</b></div><div class="best"><small>最佳 BEST</small><b id="best">—</b></div></div><button id="pause" class="tool" aria-label="暂停">Ⅱ</button><button id="reset" class="tool" aria-label="重开">↻</button></header>
<main><canvas id="game" aria-label="灰盒赛车赛道"></canvas><button id="map-menu" class="map-menu" aria-label="选择地图"><span id="map-title">MAP 01 · Concrete Loop</span> ▾</button><div id="route-hud" class="route-hud"></div><nav class="views" aria-label="驾驶视角"><button data-view="first" aria-pressed="true">第一视角</button><button data-view="chase" aria-pressed="false">车后追尾</button><button data-view="top" aria-pressed="false">俯视</button></nav><div class="speed"><strong id="speed">0</strong><span>KM/H</span><small id="surface">就绪</small></div><aside id="team-hud" class="team-hud" aria-label="2 对 2 队伍竞速"><b id="team-rank">你 4 / 4</b><span id="team-score">当前队伍积分</span><small id="team-order"></small><small id="team-intent"></small></aside><div id="toast"></div><div id="feedback" class="feedback" role="status" aria-live="polite" hidden><b id="feedback-title"></b><span id="feedback-detail"></span></div>
<div class="overlay" id="overlay"><section><div class="map-picker" aria-label="选择地图"><button data-map="circuit" aria-pressed="true">01 · Concrete Loop</button><button data-map="mountain" aria-pressed="false">02 · Mountain Road</button><button data-map="proving" aria-pressed="false">03 · 测试场</button><button data-map="city" aria-pressed="false">04 · 城市</button><button data-map="offroad" aria-pressed="false">05 · 越野</button></div><div class="eyebrow" id="map-eyebrow">YOUR FIRST GRAYBOX LAP</div><h1>给简单的方块，<br>一点速度。</h1><p>一辆车，一条赛道。完成 3 圈计时挑战。<br>驶出路面会减速，碰撞会反弹。<br>外侧黄黑边缘是落差区，掉落后自动回赛道 +5 秒。</p><div class="keys">左手转向 <span>＋</span> 右手油门 / 刹车</div><button id="start" class="primary">开始驾驶 <span>↗</span></button><small class="hint">手机横屏更好玩 · WASD / 方向键驾驶 · V 切换视角</small></section><div class="track-label">TEST CIRCUIT<br><b id="map-label">01 / CONCRETE LOOP</b></div></div>
<div class="controls"><div class="steering"><button data-key="left" aria-label="左转">◀</button><button data-key="right" aria-label="右转">▶</button></div><button id="recover" class="recover">回赛道</button><div class="pedals"><button data-key="brake" class="brake">刹车</button><button data-key="gas" class="gas">油门 <span>↑</span></button></div></div></main>
<script src="maps.js?v=9"></script><script src="course-pack.js?v=9"></script><script src="course-world.js?v=9"></script><script src="racers.js?v=9"></script><script src="game.js?v=9"></script><script src="perspective.js?v=9"></script></body></html>
