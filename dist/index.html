<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#171c21"><title>灰盒车场 · GRAYBOX DRIVE</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<header><div class="brand"><span class="mark">G<span>↗</span></span><div>灰盒车场<small>GRAYBOX DRIVE / 001</small></div></div><div class="stats"><div><small>圈数 LAP</small><b id="lap">1 <em>/ 3</em></b></div><div><small>用时 TIME</small><b id="time">00:00.00</b></div><div class="best"><small>最佳 BEST</small><b id="best">—</b></div></div><button id="pause" class="tool" aria-label="暂停">Ⅱ</button><button id="reset" class="tool" aria-label="重开">↻</button></header>
<main><canvas id="game" aria-label="灰盒赛车赛道"></canvas><div class="tag"><i></i> 可玩原型 <span>先感受驾驶，再谈美术。</span></div><nav class="views" aria-label="驾驶视角"><button data-view="first" aria-pressed="true">第一视角</button><button data-view="chase" aria-pressed="false">车后追尾</button><button data-view="top" aria-pressed="false">俯视</button></nav><div class="speed"><strong id="speed">0</strong><span>KM/H</span><small id="surface">就绪</small></div><div id="toast"></div><div id="feedback" class="feedback" role="status" aria-live="polite" hidden><b id="feedback-title"></b><span id="feedback-detail"></span></div>
<div class="overlay" id="overlay"><section><div class="eyebrow">YOUR FIRST GRAYBOX LAP</div><h1>给简单的方块，<br>一点速度。</h1><p>一辆车，一条赛道。完成 3 圈计时挑战。<br>驶出路面会减速，碰撞会反弹。<br>外侧黄黑边缘是落差区，掉落后自动回赛道 +5 秒。</p><div class="keys">左手转向 <span>＋</span> 右手油门 / 刹车</div><button id="start" class="primary">开始驾驶 <span>↗</span></button><small class="hint">手机横屏更好玩 · WASD / 方向键驾驶 · V 切换视角</small></section><div class="track-label">TEST CIRCUIT<br><b>01 / CONCRETE LOOP</b></div></div>
<div class="controls"><div class="steering"><button data-key="left" aria-label="左转">◀</button><button data-key="right" aria-label="右转">▶</button></div><button id="recover" class="recover">回赛道</button><div class="pedals"><button data-key="brake" class="brake">刹车</button><button data-key="gas" class="gas">油门 <span>↑</span></button></div></div></main>
<script src="game.js?v=6"></script><script src="perspective.js?v=5"></script></body></html>
